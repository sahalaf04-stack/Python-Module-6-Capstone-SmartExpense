<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>SmartExpense</title>

    <link rel="stylesheet"
          href="style.css">

</head>

<body>

    <div class="container">

        <h1>💰 SmartExpense</h1>

        <p>Simple Expense Tracking System</p>


        <div class="summary">

            <div class="card">

                <h3>Total Spending</h3>

                <p id="total">
                    ₹0
                </p>

            </div>

            <div class="card">

                <h3>Total Expenses</h3>

                <p id="count">
                    0
                </p>

            </div>

        </div>


        <div class="form">

            <h2>Add Expense</h2>

            <input
                id="title"
                placeholder="Expense title"
            >

            <input
                id="amount"
                type="number"
                placeholder="Amount"
            >

            <input
                id="category"
                placeholder="Category"
            >

            <input
                id="description"
                placeholder="Description"
            >

            <button onclick="addExpense()">
                Add Expense
            </button>

        </div>


        <h2>Recent Expenses</h2>

        <div id="expenses"></div>

    </div>


    <script src="script.js"></script>

</body>

</html>
